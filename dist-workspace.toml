[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = ["github"]
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# Packages to distribute from this workspace
packages = ["whipplescript"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# The tap the Homebrew formula is published into
tap = "GaugeWright/homebrew-tap"
# Publish the formula to the tap as part of the release
publish-jobs = ["homebrew"]
# Where to host releases
hosting = ["github"]
# Whether to install an updater program
install-updater = false
# No release workflow exists: scripts/release-fleet.sh cuts the release on the
# company's fleet (GaugeWright DR-0140) and runs dist's build steps itself, so
# dist must not insist on a generated .github/workflows/release.yml. Removing
# `ci` above would only drop the GitHub runner matrix from `dist plan`'s output.
allow-dirty = ["ci"]
