[workspace]
members = [
    "crates/whipplescript-cli",
    "crates/whipplescript-core",
    "crates/whipplescript-custody",
    "crates/whipplescript-custodian",
    "crates/whipplescript-host-do",
    "crates/whipplescript-kernel",
    "crates/whipplescript-parser",
    "crates/whipplescript-provider-claude",
    "crates/whipplescript-provider-codex",
    "crates/whipplescript-store",
]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/GaugeWright/whipplescript"
repository = "https://github.com/GaugeWright/whipplescript"
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Dependencies are built without debug info. They dominate target/debug/deps,
# and debug info measured ~78% of binary size (whipplescript, 2026-07-25).
# Local crates keep full debuggability: panics and the debugger still work here.
[profile.dev.package."*"]
debug = false
