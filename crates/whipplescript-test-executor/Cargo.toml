[package]
name = "whipplescript-test-executor"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Buck2 test executor of DR-0124 §14.5: speaks Buck2's external test-executor protocol, runs each case as its own action through Buck2's orchestrator, and writes the versioned support report the norm plane reads"
homepage.workspace = true
repository.workspace = true
readme.workspace = true

# Not distributed yet: the executor ships with the wrapper of DR-0124 step 4,
# which owns the daemon it is configured into.
[package.metadata.dist]
dist = false

[package.metadata.native-tests]
# What this crate's tests read at run time beyond the crate and what its
# sources name by relative path, for the native test runs (GaugeWright BUILD.md
# stages 5 and 6). The ignored tests run a real Buck2 over examples/buck2-tests,
# which the sources reach by joining path components, so it is named here, and
# its dotfiles by name besides, because a glob never matches one: they make it
# a project of its own and pin the Buck2 it records. A run's mount holds
# only declared files, so a missing entry fails the test instead of caching a
# pass it never earned.
data = ["examples/buck2-tests", "examples/buck2-tests/.buck2-version", "examples/buck2-tests/.buckconfig", "examples/buck2-tests/.buckroot", "examples/buck2-tests/inner/.buckconfig"]

[dependencies]
whipplescript-core = { version = "0.7.1", path = "../whipplescript-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Buck2's test-executor protocol is gRPC over the two connections the daemon
# opens for the executor (DR-0124 §14.5). tonic and prost are the protocol's
# own stack; the generated code under src/proto is checked in, produced once
# from the vendored proto files by a pure-Rust compiler, so no protoc is
# needed to build and a test proves the checked-in code is current.
tonic = { version = "0.14", default-features = false, features = ["channel", "server", "router", "codegen"] }
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }
async-trait = "0.1"
futures = "0.3"

[dev-dependencies]
protox = "0.9"
prost-build = "0.14"
tonic-prost-build = "0.14"
tempfile = "3"

[[bin]]
name = "whip-test-executor"
path = "src/main.rs"

[lints]
workspace = true
