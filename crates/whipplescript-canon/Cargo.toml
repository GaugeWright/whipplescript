[package]
name = "whipplescript-canon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Syntactic declaration canonicalizers for WhippleScript's workspace VCS: Rust, TypeScript and Markdown sections"
homepage.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]
whipplescript-store = { version = "0.10.0", path = "../whipplescript-store", default-features = false }
sha2 = "0.11"
tree-sitter = "0.25"
