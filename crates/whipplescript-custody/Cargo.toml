[package]
name = "whipplescript-custody"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Credential custody protocol for WhippleScript (DR-0053): handles, sentinels, the operation vocabulary, and the transport seam"
homepage.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]
# The egress allow-list matches host and path components with the ONE glob
# matcher this workspace owns, rather than adding a third copy beside
# `core::selection::glob_matches` and `kernel::effect_handlers::glob_match`.
whipplescript-core = { version = "0.5.6", path = "../whipplescript-core" }
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
base64 = "0.23"

[lints]
workspace = true
