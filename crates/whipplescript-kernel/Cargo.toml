[package]
name = "whipplescript-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Runtime kernel and provider integrations for WhippleScript workflows"
homepage.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["alloc", "std"] }
chrono-tz = "0.10.4"
whipplescript-core = { version = "0.5.5", path = "../whipplescript-core" }
whipplescript-custody = { version = "0.5.5", path = "../whipplescript-custody" }
whipplescript-parser = { version = "0.5.5", path = "../whipplescript-parser" }
whipplescript-store = { version = "0.5.5", path = "../whipplescript-store", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pure-Rust, wasm-clean: script-pin verification + delta-kernel content keys
# for the exec-over-HTTP path (compute plane P8).
sha2 = "0.11"
# Placement-neutral governed bash. Default features are disabled so the kernel
# does not acquire Bashkit's separate LLM-tool wrapper; WhippleScript owns the
# model-facing contract through `WhipShell`.
bashkit = { version = "=0.16.0", default-features = false, features = ["jq"] }
futures = { version = "0.3", default-features = false, features = ["executor"] }
# DR-0080 provider-input normalization. Feature-minimized, pure-Rust codecs keep
# native and Durable Object placements on the same deterministic conversion path.
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp"] }
pdf-extract = "0.12.0"
office_oxide = { version = "0.1.8", default-features = false }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Mirrors bashkit's own `time_compat` shim, whose `SystemTime` is `web_time`'s on
# wasm32 and `std`'s everywhere else. That module is private, so the
# `FileSystem::set_modified_time` signature cannot be spelled without naming the
# same type on the same cfg. `target_arch`, not `target_family`, because that is
# the cfg bashkit switches on.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { version = "1", features = ["rt", "time"] }

[dev-dependencies]
# An in-process custodian for the governance-signing roundtrip tests
# (DR-0053 §10) — dev-only, so the kernel's wasm build stays custodian-free.
whipplescript-custodian = { version = "0.5.5", path = "../whipplescript-custodian" }
zeroize = "1"
# Test-only SQL, so a kernel test can construct the inconsistent tracker state
# that makes a store call FAIL — the only way to reach the queue dispatch's
# store-error arm, which is otherwise unreachable through any supported API.
# Dev-only for the same reason as the custodian above: the kernel's wasm build
# stays free of rusqlite.
rusqlite = { version = "0.40.1", features = ["bundled"] }

[features]
# `native` pulls in the rusqlite-backed store (whipplescript-store/native); the
# kernel itself is store-backend-agnostic (RuntimeKernel<S: RuntimeStore>), so a
# wasm consumer builds with `--no-default-features` to drop rusqlite (DR-0033
# Phase 5). Provider adapters are optional and EXTERNAL (DR-0024 provider-crate
# split): the owned brokered harness is the built-in path; Codex and Claude now
# live in the whipplescript-provider-codex / -claude crates (kernel-independent).
# The kernel has zero compile-time knowledge of any external provider.
default = ["native"]
native = ["whipplescript-store/native"]
# Exposes deterministic legacy-envelope construction only to downstream test
# targets. Production embeddings must use an external governance signature.
test-support = []

[lints]
workspace = true
