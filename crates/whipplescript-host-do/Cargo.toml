[package]
name = "whipplescript-host-do"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cloudflare Durable Object host binding for the sans-IO WhippleScript core"
# Deliberately NOT published. This is a Cloudflare-specific host binding whose
# only consumer is the in-repo Worker build (`worker/` → wasm-bindgen → pkg/),
# not `cargo add`: it is a cdylib whose JS boundary is wasm32-only, so a
# registry copy would be inert off that target. The publish chain is the seven
# crates named in `spec/distribution-tracker.md`; without this flag that
# exclusion lived only in prose and `cargo publish --workspace` would ship it.
# Nothing depends on this crate — verified across the workspace, GaugeDesk, and
# gaugewright-cloud, whose sole mentions are a comment.
publish = false
homepage.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]
# The sans-IO core, built WITHOUT the native (rusqlite) backend — the DO supplies
# its own storage. `sansio` (HostDriver / IoRequest / HttpRequest) lives here.
whipplescript-kernel = { version = "0.5.0", path = "../whipplescript-kernel", default-features = false }
# Content hashes byte-identical to the native store's (pure-Rust, wasm-safe).
sha2 = "0.11"
# The store TRAITS (RuntimeStore / Coordination / WorkItems / FileStore) + data
# types, no rusqlite.
whipplescript-store = { version = "0.5.0", path = "../whipplescript-store", default-features = false }
whipplescript-parser = { version = "0.5.0", path = "../whipplescript-parser" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
p256 = { version = "0.14", default-features = false, features = ["ecdsa"] }
hex = "0.4"
regex = "1"

[dev-dependencies]
serde_json = "1"
# Backs the DoSql interface with real SQLite in tests, so the ported DO-store SQL
# is verified against an actual SQL engine (native-only test dependency).
rusqlite = { version = "0.40.1", features = ["bundled"] }
# Provides `Severity` for constructing `DiagnosticRecord` in the store tests.
whipplescript-core = { version = "0.5.0", path = "../whipplescript-core" }

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The JS<->Rust boundary for the Cloudflare Worker shell. wasm32-only so the native
# build (and its rusqlite tests) never pull it. The #[wasm_bindgen] surface is a thin
# wrapper over DurableInstance::create/step/status (do_worker); it carries no logic.
wasm-bindgen = "0.2"
