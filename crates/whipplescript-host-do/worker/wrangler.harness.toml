# Cloudflare Worker + Durable Object deployment for the WhippleScript runtime
# (DR-0033 chunk 5d). Aligns with Cloudflare's DO-with-SQLite docs.
#
# This is the **GaugeDesk hosted harness** target (`GAUGEDESK_DO_HOST_*`), and
# nothing else. It was called `wrangler.toml` until 2026-08-11, which made it
# wrangler's implicit default: `wrangler deploy`, `npm run deploy`, and
# `whip deploy` all landed here whether or not the operator meant this worker.
# Public embed sessions run on `whipplescript-public-runtime`
# (`wrangler.public.toml`), so a change shipped by the documented command
# reached a live worker that no visitor talks to. That cost hours before anyone
# checked which script the edge actually binds. There is no default config in
# this directory any more; every deploy names its target.
name = "whipplescript-runtime"
# Pinned for the same reason as `wrangler.public.toml`: without it wrangler
# resolves the account from the ambient OAuth session, and the founder's
# personal account is still a valid login (DR-0044 Phase 2). This config was
# the last one left unpinned, which is how `npm run deploy` — the documented
# command — could publish to whichever account happened to be logged in.
account_id = "1689dd452ba2d2d8eb1f3c364c92b3f4"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# Bundle the DO schema as a text module (imported by src/index.ts).
rules = [{ type = "Text", globs = ["**/*.sql"] }]

# The Durable Object holding one workflow instance. `new_sqlite_classes` gives it
# the SQLite-backed storage the runtime store is ported to (do_store.rs / DoSql).
# The external byte tier (DR-0113): content that cannot live in a DO SQLite
# value — anything that is not text, and text past the value ceiling — is held
# here under its own content id, streamed through the Worker's `/v1/objects`
# plane so the isolate never buffers it.
[[r2_buckets]]
binding = "WHIP_OBJECTS"
bucket_name = "whip-objects-harness"

[[durable_objects.bindings]]
name = "WORKFLOW_INSTANCE"
class_name = "WorkflowInstance"

# Public session objects reserve/settle spend with their owning deployment DO.
# Only reservation metadata crosses this binding; provider/model bytes do not.
[[durable_objects.bindings]]
name = "SESSION_ADMISSION"
class_name = "Deployment"
script_name = "gaugewright-edge-runtime"

[[durable_objects.bindings]]
name = "PUBLIC_CREDENTIALS"
class_name = "CredentialRegistry"
script_name = "gaugewright-edge-runtime"

# The Class-A executor pool (compute plane P8): `whip executor` containers,
# each paired 1:1 with an ExecutorContainer DO; the workflow DO routes
# whip-executor/1 rounds through the workspace broker below. Pool size is the
# manual knob until platform autoscaling ships.
[[durable_objects.bindings]]
name = "EXECUTOR"
class_name = "ExecutorContainer"

# The workspace-DO broker owning Class-A placement (compute plane note §3):
# one object per deployment; exec rounds are admitted workspace-wide under
# the priority discipline (production > working > counterfactual) and placed
# on the least-loaded container.
[[durable_objects.bindings]]
name = "WORKSPACE_BROKER"
class_name = "WorkspaceBroker"

# Scaled to zero on 2026-08-11. The pool was provisioned on 2026-07-28 and has
# been carrying four instances since, on a worker whose only consumer is an
# opt-in developer harness — nothing in any repository points a product path at
# it. Raise this deliberately when the harness needs the Class-A pool again;
# leaving it at four so the capacity is "there" is how it went unnoticed.
# Raise WHIP_EXECUTOR_POOL_SIZE below in the same change — the broker sizes
# its slot bound from that knob.
[[containers]]
class_name = "ExecutorContainer"
# The verified norm executor image, pinned by the manifest digest its push
# reported (DR-0140): scripts/build-norm-executor-image.sh verified it and
# scripts/push-norm-executor-image.sh pushed it. The registry is
# content-addressed, so this can run no other image. The pool stays at zero:
# the evidence half waits on FB-6 (DR-0139).
image = "registry.cloudflare.com/1689dd452ba2d2d8eb1f3c364c92b3f4/whipplescript-norm-executor@sha256:26baddfc4ba3e82ad7126cfbced61d69a1a6838bf47ba62af9f6e9145f5d7559"
max_instances = 0
instance_type = "lite"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WorkflowInstance"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ExecutorContainer"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["WorkspaceBroker"]

[vars]
# Sentinel host for the executor pool: exec NeedsHttp rounds whose URL
# targets this host are routed to a container stub, not the public network.
WHIP_EXECUTOR_URL = "http://executor"
# Class-A pool size, kept in step with `[[containers]] max_instances` above.
# While the pool is scaled to zero the broker refuses exec rounds with an
# explicit error instead of dispatching to containers that cannot start.
WHIP_EXECUTOR_POOL_SIZE = "0"
# Sentinel host for Class-B turn containers: agent turns run whole in a
# per-turn container (idFromName over the turn id) over whip-turn/1.
WHIP_TURN_URL = "http://turn"
# Governed harness turns use the closed synthetic broker. The token is a
# Worker secret shared only with that broker, never a provider credential.
WHIP_MODEL_BROKER_URL = "https://models.gaugewright.com/_canary/whip-model-egress"
# The norm plane's ledger half (DR-0140): the production canary ledger's
# public bindings and creation grant, and the restoration pinning its object
# (tenant synthetic-wiring, placement production-norm-ledger-canary-v1) to the
# ledger's genesis checkpoint. Public keys only; the signing keys are held by
# the custodian on the founder's workstation. No planning, runtime or
# image binding is set, so the evidence doors answer unavailable (DR-0139).
WHIP_NORM_TRUST = '{"bindings":[],"creation_grants":[{"creator":"norm-canary-worker","owner":"norm-canary-owner"}],"public_bindings":[{"actor":{"principal":"norm-canary-owner","algorithm":"ed25519-custodian","key_id":"credential:norm/canary-owner#local"},"public_key_hex":"10cd2b6605e11c0bf46a16b27d7a720a83237ca9646f590adef687ad22012798"},{"actor":{"principal":"norm-canary-worker","algorithm":"ed25519-custodian","key_id":"credential:norm/canary-worker#local"},"public_key_hex":"8b63653f041934d80ca209c9af6a2b6468cb91d8c9ced6d3d163ce59330c7fe0"},{"actor":{"principal":"norm-canary-publisher","algorithm":"ed25519-custodian","key_id":"credential:norm/canary-publisher#local"},"public_key_hex":"e125d4939b6abf4d44455ea791e1372d767adc09dac3db90373de47bb76490b1"}],"restorations":[{"object_id":"e4e5bbe8746e192b5140cf8f09697ae15080ed3d92340b6fb336ac6b53a52c9b","checkpoint":{"ledger":"2b323b0a7c16a088c0a7f073361a48184c03ee9da80aa66c7c3e8aee5c0ae79f","authority_head":"2b323b0a7c16a088c0a7f073361a48184c03ee9da80aa66c7c3e8aee5c0ae79f"}}]}'

# The wasm module built from the #[wasm_bindgen] surface (crate whipplescript-host-do).
# `wasm-pack build --target bundler` emits worker/pkg/*; the bundler inlines the .wasm.
[build]
command = "npm run build:wasm"

# Secret-free governed turns configure the non-secret broker URL, then set only
# the broker-hop token as a Worker secret. The verified signed policy epoch owns
# the exact non-secret provider tuple; there is no Worker provider map.
#   wrangler secret put WHIP_MODEL_BROKER_TOKEN
