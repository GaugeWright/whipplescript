[package]
name = "whipplescript-parser"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Parser and static checks for WhippleScript workflow source"
homepage.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]
whipplescript-core = { version = "0.6.0", path = "../whipplescript-core" }
whipplescript-custody = { version = "0.6.0", path = "../whipplescript-custody" }
# Collision-resistant source/IR identity hashes (pure-Rust, wasm-safe).
sha2 = "0.11"
# Artifact traits only; the runtime owns JSON decoding and validation.
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# Reading `spec/report-schemas/package_manifest_v0.schema.json` back, to pin its
# copy of the grammar vocabulary to core's. Test-only: the parser itself does
# not link a JSON parser.
serde_json = "1"

[build-dependencies]
# The construct-grammar vocabulary (`CONSTRUCT_GRAMMAR_*`) has one owner, and
# the build script reads it from there rather than re-declaring it. `core`
# depends on nothing but serde, so this costs a host-side compile of a leaf
# crate the parser already links.
whipplescript-core = { version = "0.6.0", path = "../whipplescript-core" }
serde_json = "1"

[lints]
workspace = true

# The construct-grammar tests run this crate's build script against a fixture
# (tests/construct_grammar_vocabulary.rs); natively it is handed to them as a
# binary (scripts/buckify-crates.py).
[package.metadata.native-tests]
build-script = true
