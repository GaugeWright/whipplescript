[package]
name = "whipplescript-parser"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Parser and static checks for WhippleScript workflow source"
homepage.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]
whipplescript-core = { version = "0.5.5", path = "../whipplescript-core" }
whipplescript-custody = { version = "0.5.5", path = "../whipplescript-custody" }
# Collision-resistant source/IR identity hashes (pure-Rust, wasm-safe).
sha2 = "0.11"

[build-dependencies]
serde_json = "1"

[lints]
workspace = true
