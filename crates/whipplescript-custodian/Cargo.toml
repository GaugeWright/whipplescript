[package]
name = "whipplescript-custodian"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The WhippleScript credential custodian (DR-0053): a second security principal that seals material and performs custody operations; whip holds handles"
homepage.workspace = true
repository.workspace = true
readme.workspace = true

# Not distributed: the custodian has never shipped, and shipping a daemon that
# holds credential material is a decision to take deliberately rather than by
# leaving a default on.
#
# This says nothing about whether the crate builds. `dist build` runs
# `cargo build --workspace`, so it compiles every member for every target no
# matter what is configured here — neither this key nor a `targets` restriction
# has any effect on that, and both were tried before the compile itself was
# fixed. The Unix-only paths are cfg-gated in src/, which is what makes the
# workspace build for x86_64-pc-windows-msvc.
[package.metadata.dist]
dist = false

[features]
default = []
# r2 `hardware` over a TPM 2.0. OFF by default and deliberately: it links the
# native tss2 stack, which is not present on every box and does not exist on
# Windows, and the DR puts r2/r3 backends at the enterprise-readiness seam.
#
# Only the DEVICE half is behind it. `tpm.rs` — the freshness rule the rung
# turns on — compiles and tests unconditionally, so the ordinary green bar
# checks the property on a machine with no TPM.
tpm = ["dep:tss-esapi"]
# r2 `hardware` over a PKCS#11 token. OFF by default for the same reasons as
# `tpm`: it loads a vendor module at runtime and the DR puts r2/r3 backends at
# the enterprise-readiness seam. Only the DEVICE half is behind it —
# `pkcs11.rs`, which decides what evidences the rung, compiles and tests
# unconditionally.
pkcs11 = ["dep:cryptoki"]

[dependencies]
whipplescript-custody = { version = "0.5.5", path = "../whipplescript-custody" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
ring = "0.17"
zeroize = "1"
# Real network egress for `request`/`mint` (DR-0053 §2): sync ureq matches the
# repo's threads-not-async execution model.
ureq = { version = "2", features = ["json", "native-certs"] }
url = "2"
# The stable line; 8.x is an alpha. Optional — see [features].
tss-esapi = { version = "7.7", optional = true }
cryptoki = { version = "0.12", optional = true }

[[bin]]
name = "whip-custodian"
path = "src/bin/whip_custodian.rs"

[lints]
workspace = true
