[package]
name = "whipplescript-custodian"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The WhippleScript credential custodian (DR-0053): a second security principal that seals material and performs custody operations; whip holds handles"
homepage.workspace = true
repository.workspace = true
readme.workspace = true

# The custodian is a Unix-domain-socket daemon by construction: serve.rs binds a
# UnixListener and sets 0o600 on the socket path, which is the custody boundary
# rather than an implementation detail. It does not build for Windows and cannot
# without a different transport, so it is distributed for the Unix targets only.
# Without this the workspace targets applied to it too, and every release build
# for x86_64-pc-windows-msvc failed on std::os::unix — which is what happened
# from 2026-08-06, when DR-0053 added this crate, until it was found on
# 2026-08-13 by dry-running the release.
# Not distributed. The custodian is a Unix-domain-socket daemon — serve.rs binds
# a UnixListener and sets 0o600 on the socket path — so it does not compile for
# x86_64-pc-windows-msvc, and it has never shipped: the crate arrived on
# 2026-08-06 with DR-0053, two weeks after the last release.
#
# Restricting `targets` here is not enough and was tried first. That filters the
# artifacts dist packages, not the crates it builds, so the Windows leg still
# compiled this one and still failed on std::os::unix. `dist = false` is what
# takes it out of the build.
#
# If it should ship, that is a decision with work behind it: the Unix-only paths
# need cfg-gating so the crate compiles everywhere it is built, and then it can
# be distributed for the Unix targets deliberately.
[package.metadata.dist]
dist = false

[dependencies]
whipplescript-custody = { version = "0.4.1", path = "../whipplescript-custody" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ring = "0.17"
zeroize = "1"
# Real network egress for `request`/`mint` (DR-0053 §2): sync ureq matches the
# repo's threads-not-async execution model.
ureq = { version = "2", features = ["json", "native-certs"] }
url = "2"

[lib]
path = "src/lib.rs"

[[bin]]
name = "whip-custodian"
path = "src/bin/whip_custodian.rs"

[lints]
workspace = true
