[package]
name = "whipplescript-remote-execution"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The remote-execution endpoint of DR-0124 §14.3–§14.4: the Remote Execution API's four services over the compute plane, under the five store rules and the versioned cut encoding, so a build result never enters the norm plane except through the publication path"
homepage.workspace = true
repository.workspace = true
readme.workspace = true

# Not distributed yet: the endpoint ships with the wrapper of DR-0124 step 4,
# which starts it for the Home's daemon.
[package.metadata.dist]
dist = false

[dependencies]
whipplescript-store = { version = "0.5.6", path = "../whipplescript-store", features = ["native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# The Remote Execution API is gRPC; the protocol files are vendored at the
# pinned Buck2 release (the client that speaks to this endpoint), the code
# generated once by a pure-Rust compiler and checked in, and a test proves the
# checked-in code is current.
tonic = { version = "0.14", default-features = false, features = ["channel", "server", "router", "codegen"] }
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time", "process", "fs", "io-std"] }
tokio-stream = { version = "0.1", features = ["net"] }
tower = { version = "0.5", features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }
async-trait = "0.1"
futures = "0.3"
rand = "0.8"
tempfile = "3"

[dev-dependencies]
protox = "0.9"
prost-build = "0.14"
tonic-prost-build = "0.14"
tempfile = "3"

[[bin]]
name = "whip-remote-execution"
path = "src/main.rs"

[lints]
workspace = true
