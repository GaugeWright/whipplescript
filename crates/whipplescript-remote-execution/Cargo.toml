[package]
name = "whipplescript-remote-execution"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The remote-execution endpoint of DR-0124 §14.3–§14.4: the Remote Execution API's four services over the compute plane, under the five store rules and the versioned cut encoding, so a build result never enters the norm plane except through the publication path"
homepage.workspace = true
repository.workspace = true
readme.workspace = true

# Not distributed yet: the endpoint ships with the wrapper of DR-0124 step 4,
# which starts it for the Home's daemon.
[package.metadata.dist]
dist = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
# The sidecar runner's wire contract carries bytes as base64 in JSON, as the
# executor's own `whip-executor/1` does.
base64 = "0.23"
# Everything below is the endpoint itself. The confined run and the sidecar's
# wire contract need none of it, which is how the `whip executor` sidecar
# mounts the action route without the endpoint's runtime (`default-features
# = false`).
whipplescript-store = { version = "0.6.0", path = "../whipplescript-store", features = ["native"], optional = true }
# The store and the action cache persist in one SQLite file beside the build
# root, at the version the rest of the workspace uses.
rusqlite = { version = "0.40.1", features = ["bundled"], optional = true }
# The Remote Execution API is gRPC; the protocol files are vendored at the
# pinned Buck2 release (the client that speaks to this endpoint), the code
# generated once by a pure-Rust compiler and checked in, and a test proves the
# checked-in code is current.
tonic = { version = "0.14", default-features = false, features = ["channel", "server", "router", "codegen"], optional = true }
tonic-prost = { version = "0.14", optional = true }
prost = { version = "0.14", optional = true }
prost-types = { version = "0.14", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time", "process", "fs", "io-std"], optional = true }
tokio-stream = { version = "0.1", features = ["net"], optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
async-trait = { version = "0.1", optional = true }
futures = { version = "0.3", optional = true }
rand = { version = "0.8", optional = true }
# The sidecar runner's client: HTTP and HTTPS to a Class-A executor, with
# rustls on the ring provider as the workspace already builds it, the
# platform's roots, and a pool's own CA from a PEM bundle.
ureq = { version = "2", features = ["json", "native-certs"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"], optional = true }
rustls-native-certs = { version = "0.7", optional = true }
rustls-pemfile = { version = "2", optional = true }

[features]
default = ["endpoint"]
endpoint = [
    "dep:whipplescript-store",
    "dep:rusqlite",
    "dep:tonic",
    "dep:tonic-prost",
    "dep:prost",
    "dep:prost-types",
    "dep:tokio",
    "dep:tokio-stream",
    "dep:tower",
    "dep:hyper-util",
    "dep:async-trait",
    "dep:futures",
    "dep:rand",
    "dep:ureq",
    "dep:rustls",
    "dep:rustls-native-certs",
    "dep:rustls-pemfile",
]

[dev-dependencies]
# A CA and a server certificate minted per test, so the sidecar's HTTPS is
# tested against a real handshake without a key in the tree.
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
protox = "0.9"
prost-build = "0.14"
tonic-prost-build = "0.14"
tempfile = "3"

[[bin]]
name = "whip-remote-execution"
path = "src/main.rs"
required-features = ["endpoint"]

[lints]
workspace = true
