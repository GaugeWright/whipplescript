name: CI

# THE DEEP SUITES ONLY. This workflow runs no part of the green bar.
#
# Until 2026-09-22 it carried the per-change gate as well — `green-bar`,
# `new-refusals`, `windows-compiles` and `hosted-runtime-contracts`, each a
# required status check on `main` and on the merge queue's ref. GaugeWright
# DR-0131 moved every gate off the forge: the company's gates execute on its own
# fleet, which materializes the workspace at the pushed revision, runs
# `scripts/check.sh required`, and posts the verdict on the commit as the
# `gaugewright/bar` status. The forge supplies the trigger and displays the
# verdict and runs no part of a bar (FLEET.md, stage 1: "nothing that runs a
# bar remains in `.github/`"). The four jobs are gone rather than disabled, and
# with them the `push`, `pull_request` and `merge_group` triggers, because
# every job that remains is conditioned on the schedule or on the `deep` input
# and a per-change run of this file would have started only to skip them all.
#
# What each retired job covered, and where it is answered now:
#
#   green-bar                 `scripts/check.sh required` — the fleet's bar.
#   hosted-runtime-contracts  the bar's `hosted-runtime` section. It ran as its
#                             own job here only so the green-bar job could skip
#                             it (`WHIPPLESCRIPT_CHECK_SKIP_HOSTED`); the fleet
#                             runs the bar with the flag unset, so the section
#                             runs inside the one bar.
#   windows-compiles          `scripts/check-windows-compile.sh` on a Windows
#                             runner. The bar's `windows-compile` section skips
#                             on any other host and says so. The fleet's
#                             Windows host runs it on default-branch heads;
#                             release still compiles every target in
#                             dist-workspace.toml.
#   new-refusals              `scripts/check-new-refusals.sh` against the merge
#                             base — a question only a diff can ask, so it was
#                             never in the bar. The fleet runs it as a separate
#                             per-change pull request job under the manifest's
#                             `gate.jobs` block.
#
# The same file is published to the public mirror verbatim (publish-mirror.sh),
# so the suites below that are marked mirror-only run there on the weekly cron
# and on dispatch; `release-readiness` drives scripts and credentials the mirror
# does not carry and stays here. `mirror-schedule-verdict.yml` reads the
# mirror's scheduled result back into this repository.

on:
  workflow_dispatch:
    inputs:
      deep:
        description: Run formal, end-to-end, schema, and release-readiness checks
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "37 6 * * 2"

permissions:
  # Read-only by default; a job that needs more declares it.
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A scheduled or dispatched run of the deep suites is never superseded by a
  # later one: a cancelled run is recorded as `failure` with no failing job,
  # and that red never meant anything.
  cancel-in-progress: false

jobs:
  # Mirror only — 112 Maude tests, about ten minutes; free on the mirror.
  formal-models:
    if: ${{ github.repository == 'GaugeWright/whipplescript' && (github.event_name == 'schedule' || inputs.deep) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install Maude
        run: |
          sudo apt-get update
          sudo apt-get install -y maude
      - name: Install Python tooling
        run: python3 -m pip install --user -r requirements-dev.txt
      - name: Formal model checks
        run: WHIPPLESCRIPT_FORMAL_SKIP_TLA=1 scripts/check-formal-models.sh

  # Mirror only — the Lean proof layer, on the deep schedule with the other
  # model suites. It is the quick one: hermetic, offline, no Mathlib, fifteen
  # targets. Until #291 it ran nowhere at all, and read as covered because the
  # since-retired `sync-public-mirror.yml` named the script in a `paths:`
  # trigger filter.
  lean-models:
    if: ${{ github.repository == 'GaugeWright/whipplescript' && (github.event_name == 'schedule' || inputs.deep) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      # Installs elan and the toolchain `models/lean/lean-toolchain` pins, and
      # caches `.lake`. It is told to build nothing: `check-lean-models.sh` owns
      # the build because it also refuses sorry/admit/axiom/native_decide, and a
      # `lake build` beside it would report a green that skipped that refusal.
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          lake-package-directory: models/lean
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
      - name: Lean proof checks
        run: scripts/check-lean-models.sh

  # Mirror only — Nix plus TLC.
  tla-models:
    if: ${{ github.repository == 'GaugeWright/whipplescript' && (github.event_name == 'schedule' || inputs.deep) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: TLA model checks
        run: scripts/check-tla-models.sh

  # Mirror only — the end-to-end suite.
  e2e:
    if: ${{ github.repository == 'GaugeWright/whipplescript' && (github.event_name == 'schedule' || inputs.deep) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: E2E smoke
        run: scripts/check-e2e.sh

  # Mirror only — schema conformance.
  report-schemas:
    if: ${{ github.repository == 'GaugeWright/whipplescript' && (github.event_name == 'schedule' || inputs.deep) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install Maude
        run: |
          sudo apt-get update
          sudo apt-get install -y maude
      - name: Install Python tooling
        run: python3 -m pip install --user -r requirements-dev.txt
      - name: Report schema checks
        run: scripts/check-report-schemas.sh

  # `-src` only: it drives scripts and credentials the mirror does not carry.
  #
  # ON THE SCHEDULE AS WELL AS ON DISPATCH, which it was not. The condition read
  # `inputs.deep` alone, and `inputs` is null on a `schedule` event — so the
  # weekly cron could never fire this job and its ONLY trigger was a hand
  # dispatch, which AGENTS.md forbids an agent from performing. Everything
  # reachable only from `scripts/check-release-readiness.sh` therefore had no
  # effective trigger at all: the `.ir` golden check, the store-replay and
  # trace<->model conformance bridges, the artifact-admission differential, the
  # cancellation policy matrix, the control-plane driver, the docs site.
  # `scripts/README.md` already described this job as "on schedule or dispatch";
  # the condition is what did not say so.
  #
  # Every sibling deep job spells the same pair the same way — see formal-models,
  # lean-models, tla-models, e2e, report-schemas above; only the repository half
  # differs, because those five run on the mirror and this one cannot.
  release-readiness:
    if: ${{ github.repository != 'GaugeWright/whipplescript' && (github.event_name == 'schedule' || inputs.deep) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install Python tooling
        run: python3 -m pip install --user -r requirements-dev.txt
      - name: Release readiness
        # The skip is a delegation, not a hole: `report-schemas` above runs
        # `scripts/check-report-schemas.sh` on the same weekly cron, on the
        # mirror, with the Maude and jsonschema tooling it needs and this job
        # does not install. Dropping the flag here would fail on missing tooling
        # rather than check anything more.
        run: WHIPPLESCRIPT_RELEASE_SKIP_REPORT_SCHEMAS=1 scripts/check-release-readiness.sh
      - name: Upload readiness reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: readiness-reports
          path: |
            target/release-readiness-report.md
            target/real-provider-smoke-report.md
