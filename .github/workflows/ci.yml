name: CI

on:
  workflow_dispatch:
    inputs:
      deep:
        description: Run formal, end-to-end, schema, and release-readiness checks
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE-APACHE'
      - 'LICENSE-MIT'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE-APACHE'
      - 'LICENSE-MIT'
  schedule:
    - cron: "37 6 * * 2"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded runs on a branch are wasted minutes, so they still cancel.
  # Trunk is different: when a burst of merges cancels a run, the run is
  # recorded as `failure` with no failing job, and that red never meant
  # anything. A trunk verdict you have to click through to trust is worth
  # less than the minutes cancelling it saves.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# WHERE EACH JOB RUNS. This one file is published to the public mirror
# verbatim, so it is the CI for both repositories and every job says which one
# it belongs to.
#
# `-src` is private and bills Actions at 1x, and its allowance is exhausted:
# jobs there are either never assigned a runner or evicted mid-run at six to
# seven minutes. Across every run recorded before 2026-08-07 the green bar
# never once completed. The mirror is public, so its minutes are free and its
# runners finish.
#
# So the long jobs run on the mirror and `-src` keeps only the one job that
# fits under its ceiling and owns configuration the mirror should not drive.
# The repository check is spelled out in each job rather than hoisted into a
# variable because `env` is not available to a job-level `if`.
#
# None of this is a statement about secrecy. It is about which repository can
# afford to run the job.

jobs:
  # The per-change gate runs the repository's own green bar, so a local pass and
  # a gate pass cannot mean different things. Add checks to scripts/check.sh.
  #
  # Mirror only: it needs ten-plus minutes and `-src` cannot give it that.
  green-bar:
    if: ${{ github.repository == 'GaugeWright/whipplescript' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      # rustup materializes the toolchain named in rust-toolchain.toml.
      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Single-threaded, so the last line printed IS the test that was
      # running when the runner died — under the parallel workspace run the
      # last printed line only bounds a region. Resource exhaustion and
      # concurrency cancellation are both already ruled out by measurement:
      # the sampler showed 12.5GB of 16GB free, 85GB of disk free, load 4.6 on
      # 4 cpus, and the mirror's syncs are hours apart with trunk cancellation
      # already disabled. The suite also passes locally in every configuration
      # tried, including 20 runs pinned to 2 cores with a canary process in the
      # test binary's own process group to catch a stray group signal.
      #
      # If the runner dies here, the next line names the test. If it survives
      # here and dies in the workspace run below, the trigger is parallelism
      # rather than any single test. Either answer ends the guessing.
      - name: Pinpoint the kernel test the runner dies on
        run: cargo test -p whipplescript-kernel --lib -- --test-threads=1 --nocapture

      - name: Green bar
        # The hosted runtime contracts are the `hosted-runtime-contracts` job
        # below, which runs the same four steps with the wasm-bindgen/wrangler/
        # Node toolchain they need. This job installs none of it, so without the
        # opt-out the green bar fails on missing tooling every run.
        #
        # The sampler is here because this job has been dying mid-test-run with
        # "The runner has received a shutdown signal" and nothing else: no
        # failing test, no panic, no non-zero exit. That message means the agent
        # was terminated, which on a hosted runner is normally resource
        # exhaustion. The suite has not been reproducible off the runner — it
        # passes on 2 pinned cores, under fsync load, and with a canary process
        # in the test's own process group to catch a stray group signal — so the
        # next step is to watch the runner rather than guess again. Remove this
        # once the log shows what is exhausted.
        env:
          WHIPPLESCRIPT_CHECK_SKIP_HOSTED: "1"
        run: |
          echo "runner: $(nproc) cpus"
          free -m || true
          df -h / || true
          ( while sleep 10; do
              printf '[sampler] %s mem_avail=%sMB swap_free=%sMB disk_avail=%s load=%s procs=%s\n' \
                "$(date -u +%H:%M:%S)" \
                "$(awk '/MemAvailable/{print int($2/1024)}' /proc/meminfo)" \
                "$(awk '/SwapFree/{print int($2/1024)}' /proc/meminfo)" \
                "$(df -h --output=avail / | tail -1 | tr -d ' ')" \
                "$(cut -d' ' -f1 /proc/loadavg)" \
                "$(ps -e --no-headers | wc -l)"
            done ) &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT
          scripts/check.sh

  # Runs on BOTH: it finishes in about two minutes, inside what `-src` can
  # sustain, and it is the one gate that touches Worker deploy configuration.
  hosted-runtime-contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/whipplescript-host-do/worker
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      # rustup materializes the toolchain and wasm target named in
      # rust-toolchain.toml.
      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install matching wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: crates/whipplescript-host-do/worker/package-lock.json
      - run: npm ci
      - name: Inventory production runtime routes and run authenticated compositions
        run: npm test
      - name: Typecheck Worker
        run: npx tsc --noEmit
      - name: Build production public Worker artifact
        run: npx wrangler deploy --config wrangler.public.toml --dry-run --outdir dist-ci

  # Mirror only — 112 Maude tests, about ten minutes; free on the mirror.
  formal-models:
    if: ${{ github.repository == 'GaugeWright/whipplescript' && (github.event_name == 'schedule' || inputs.deep) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install Maude
        run: |
          sudo apt-get update
          sudo apt-get install -y maude
      - name: Install Python tooling
        run: python3 -m pip install --user -r requirements-dev.txt
      - name: Formal model checks
        run: WHIPPLESCRIPT_FORMAL_SKIP_TLA=1 scripts/check-formal-models.sh

  # Mirror only — Nix plus TLC.
  tla-models:
    if: ${{ github.repository == 'GaugeWright/whipplescript' && (github.event_name == 'schedule' || inputs.deep) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: TLA model checks
        run: scripts/check-tla-models.sh

  # Mirror only — the end-to-end suite.
  e2e:
    if: ${{ github.repository == 'GaugeWright/whipplescript' && (github.event_name == 'schedule' || inputs.deep) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: E2E smoke
        run: scripts/check-e2e.sh

  # Mirror only — schema conformance.
  report-schemas:
    if: ${{ github.repository == 'GaugeWright/whipplescript' && (github.event_name == 'schedule' || inputs.deep) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install Maude
        run: |
          sudo apt-get update
          sudo apt-get install -y maude
      - name: Install Python tooling
        run: python3 -m pip install --user -r requirements-dev.txt
      - name: Report schema checks
        run: scripts/check-report-schemas.sh

  # `-src` only, and dispatch only. It drives scripts and credentials the
  # mirror does not carry, and it is far too long for `-src`'s weekly cron to
  # ever finish — so it is a deliberate manual pre-release step, matching how
  # spec/release-checklist.md already describes it.
  release-readiness:
    if: ${{ github.repository != 'GaugeWright/whipplescript' && inputs.deep }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install Python tooling
        run: python3 -m pip install --user -r requirements-dev.txt
      - name: Release readiness
        run: WHIPPLESCRIPT_RELEASE_SKIP_REPORT_SCHEMAS=1 scripts/check-release-readiness.sh
      - name: Upload readiness reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: readiness-reports
          path: |
            target/release-readiness-report.md
            target/real-provider-smoke-report.md
