name: CI

on:
  workflow_dispatch:
    inputs:
      deep:
        description: Run formal, end-to-end, schema, and release-readiness checks
        required: false
        default: false
        type: boolean
  # NO `paths-ignore`, deliberately, and re-adding one has bitten twice over.
  #
  # `green-bar`, `hosted-runtime-contracts`, and `new-refusals` are required
  # status checks on `main` (`windows-compiles` too, from this file).
  # A required check that never runs is not pending — it is missing —
  # so any pull request whose files all matched an ignore list reported BLOCKED
  # and could not merge at all. That stayed hidden while every documentation
  # change happened to touch `mkdocs.yml` or an asset outside the list, and
  # surfaced the first time one did not.
  #
  # It was also skipping a gate that had nothing to say about the documentation
  # in the first place, which was the deeper problem: the programs the docs tell
  # a reader to run were checked only by `check-release-readiness.sh`, a deep
  # suite that does not run on a pull request, so breaking one was caught at
  # release time or not at all. `scripts/check.sh` now runs
  # `check-docs-snippets.sh` and `check-docs-fences.sh`, so this filter would be
  # hiding real failures rather than skipping vacuous ones.
  #
  # The gate is cheap here: `-src`'s minutes come out of the Enterprise plan's
  # included allowance, and the mirror runs on GitHub-hosted runners for free
  # as a public repository. If a future filter is still wanted,
  # it has to leave the required contexts reported on every pull request, or
  # the deadlock comes back silently.
  push:
    branches: [main]
  pull_request:
  # The merge queue re-runs the required checks on a ref that carries the TRUE
  # prospective base — current main plus every entry queued ahead. A pull
  # request's own checks run against the base as of run creation, and merging
  # on them raced: the fourth DR-number collision (two DR-0088s) merged on
  # checks whose origin/main predated the sibling that claimed the number.
  # Without this trigger a queued entry times out waiting for required checks
  # that never start.
  merge_group:
  schedule:
    - cron: "37 6 * * 2"

permissions:
  # Read-only by default; a job that needs more declares it.
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded runs on a branch are wasted minutes, so they still cancel.
  # Trunk is different: when a burst of merges cancels a run, the run is
  # recorded as `failure` with no failing job, and that red never meant
  # anything. A trunk verdict you have to click through to trust is worth
  # less than the minutes cancelling it saves.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# WHERE EACH JOB RUNS. This one file is published to the public mirror
# verbatim, so it is the CI for both repositories and every job says which one
# it belongs to.
#
# The long jobs used to run on the mirror because `-src` is private, billed
# Actions at 1x, and had exhausted its allowance — jobs there were never
# assigned a runner or evicted mid-run. That is no longer the constraint:
# the Enterprise plan's included allowance covers `-src`, so both
# repositories run on the same GitHub-hosted labels. Blacksmith bridged the
# gap between those two states and is retired.
#
# So the gate comes home. `green-bar` now runs on `-src` too, where the pull
# requests are, which is the whole point of a gate: a change is checked before
# it lands rather than after it is published. Until now `rust`-affecting pull
# requests here reported green having never been compiled by anything.
#
# It keeps running on the mirror as well, because the two runs answer different
# questions: `-src` checks the change, the mirror checks the curated tree
# `publish-mirror.sh` actually publishes. `mirror-verdict.yml` carries the
# mirror's verdict back onto the trunk commit, so dropping the mirror run would
# leave a projection-only breakage reported green there.
#
# The repository check stays spelled out in each job rather than hoisted into
# a variable because `env` is not available to a job-level `if`.
#
# None of this is a statement about secrecy. It is about which repository
# should pay for, and be gated by, the job.

jobs:
  # The per-change gate runs the repository's own green bar, so a local pass and
  # a gate pass cannot mean different things. Add checks to scripts/check.sh.
  #
  # Runs on BOTH, for two different reasons. On `-src` it is the gate: it
  # belongs where the pull requests are, and until it ran here every
  # `rust`-affecting pull request reported green without being compiled by
  # anything. On the mirror it is the check on the published projection —
  # `publish-mirror.sh` builds a curated tree, and this is the only job that
  # compiles and tests that tree as a whole, so `mirror-verdict.yml` has
  # something real to carry back to trunk. Pre-merge gating is the `-src` run;
  # the mirror run is free, and a report of the projection is exactly what it
  # should be.
  #
  # This job spent a while red for a reason that had nothing to do with the
  # gate coming home, and the diagnosis is worth keeping: the suite was killing
  # the runner. `terminate_process_tree` in the kernel's command harness
  # signalled a timed-out provider's process group by shelling out to
  # `kill -TERM -<pgid>`, and procps-ng reads that leading-dash pgid as an
  # option rather than an operand — left with no operands it falls back to
  # signalling pid 0, the caller's own process group. On CI that group holds
  # the runner agent, so the harness's two timeout tests SIGTERMed and then
  # SIGKILLed the runner mid-suite. That is why no test ever failed, nothing
  # panicked, nothing came near a memory or disk limit, and 8 vCPU with 32 GB
  # died in exactly the same place as 4 vCPU: it was never resource
  # exhaustion. `-s <SIGNAL> -- -<pgid>` keeps the signal out of operand
  # position and ends option parsing, and harness.rs pins that argv in a test.
  green-bar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          # The green bar's advisory check diffs against the merge base, which a
          # shallow clone does not have. `scripts/check-new-advisories.sh` exits
          # non-zero rather than skipping when it cannot find one, so a shallow
          # checkout here fails the bar loudly instead of quietly auditing
          # nothing — same reason `new-refusals` fetches full history.
          fetch-depth: 0
      # rustup materializes the toolchain named in rust-toolchain.toml.
      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The green bar audits the dependency tree and checks its supply-chain
      # policy, so the tools it needs are installed here rather than in workflows
      # that run those checks separately. cargo-deny is version-pinned because it
      # gates license and source policy; a floating build could change a verdict
      # under an unchanged tree.
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-audit, cargo-deny@0.20.2
      # The green bar now audits the npm trees too, so this job needs the pinned
      # Node even though it skips the hosted-runtime contracts below.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
      - name: Green bar
        # The hosted runtime contracts are the `hosted-runtime-contracts` job
        # below, which runs the same four steps with the wasm-bindgen/wrangler/
        # Node toolchain they need. This job installs none of it, so without the
        # opt-out the green bar fails on missing tooling every run.
        env:
          WHIPPLESCRIPT_CHECK_SKIP_HOSTED: "1"
        run: scripts/check.sh

  # The Windows leg of the green bar. `scripts/check.sh` runs
  # scripts/check-windows-compile.sh too, and that script — not this job — owns
  # the command and the reasoning for it: a release compiles every workspace
  # member for every target in dist-workspace.toml, so a member that uses
  # std::os::unix outside a cfg passed every gate and then failed the release.
  #
  # This job exists because that script cannot answer on a Linux host: rusqlite's
  # `bundled` build script compiles C for the target, and an MSVC target wants
  # cl.exe. So the coverage runs here, through the repository's own script, and a
  # change to the command changes both callers at once. It runs that one script
  # rather than the whole bar because the rest of the bar needs a toolchain this
  # runner deliberately does without. windows-latest on both repositories — the
  # -src runner pool is Linux-only.
  # A refusal this change ADDS must be pinned by a test that fails without it.
  #
  # Its own job rather than a step in the green bar: cost is one crate rebuild
  # per touched refusal, which is proportional to the change but not to zero,
  # and a pull request that adds none finishes in seconds. `check.sh` stays the
  # one command for the required set; this asks a question only a DIFF can ask,
  # and there is no diff at all when the bar runs locally on a clean tree.
  new-refusals:
    # `-src` only. The mirror is a squash-published projection with disjoint
    # history, so a merge base there names the whole projection rather than a
    # change, and the sweep would try to pin every refusal in the repository.
    #
    # REQUIRED, and therefore on the merge queue's ref too. It went red
    # nineteen times in its first four days and every merged branch fixed the
    # finding before landing — a record held purely by each author choosing to
    # wait for an advisory check, which the queue quietly stopped showing them:
    # the queue consults only required checks, and on refusal-touching changes
    # this is the slowest check running, so "enqueue while the sweep still
    # runs" would merge an unpinned refusal without anyone declining anything.
    # The queue-ref re-run is not duplication: the sweep's scope is the diff
    # against the merge base, and the base moving underneath is exactly the
    # race the queue exists to close.
    if: ${{ github.repository != 'GaugeWright/whipplescript' }}
    runs-on: ubuntu-latest
    # The observed ceiling is 41 minutes on a twelve-site sweep; 45 left four
    # minutes of headroom, and a slow sweep read as a timeout would eject a
    # queue entry that deserved an answer.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          # The sweep diffs against the merge base, which a shallow clone does
          # not have.
          fetch-depth: 0
      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Sweep the refusals this change touched
        run: scripts/check-new-refusals.sh "origin/${{ github.base_ref || 'main' }}"

  windows-compiles:
    runs-on: windows-latest
    # An optimised `dist`-profile build of the whole workspace, cold on the
    # first run of a cache key. Twenty minutes, the rest of this file's figure,
    # is a check's budget rather than a build's.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check the workspace for x86_64-pc-windows-msvc
        shell: bash
        run: scripts/check-windows-compile.sh

  # Runs on BOTH: it finishes in about two minutes, inside what `-src` can
  # sustain, and it is the one gate that touches Worker deploy configuration.
  hosted-runtime-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: crates/whipplescript-host-do/worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      # rustup materializes the toolchain and wasm target named in
      # rust-toolchain.toml.
      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install matching wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: crates/whipplescript-host-do/worker/package-lock.json
      - run: npm ci
      - name: Inventory production runtime routes and run authenticated compositions
        run: npm test
      - name: Typecheck Worker
        run: npx tsc --noEmit
      - name: Build production public Worker artifact
        run: npx wrangler deploy --config wrangler.public.toml --dry-run --outdir dist-ci

  # Mirror only — 112 Maude tests, about ten minutes; free on the mirror.
  formal-models:
    if: ${{ github.repository == 'GaugeWright/whipplescript' && (github.event_name == 'schedule' || inputs.deep) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install Maude
        run: |
          sudo apt-get update
          sudo apt-get install -y maude
      - name: Install Python tooling
        run: python3 -m pip install --user -r requirements-dev.txt
      - name: Formal model checks
        run: WHIPPLESCRIPT_FORMAL_SKIP_TLA=1 scripts/check-formal-models.sh

  # Mirror only — the Lean proof layer, on the deep schedule with the other
  # model suites. It is the quick one: hermetic, offline, no Mathlib, fifteen
  # targets. Until #291 it ran nowhere at all, and read as covered because
  # `sync-public-mirror.yml` names the script in a `paths:` trigger filter.
  lean-models:
    if: ${{ github.repository == 'GaugeWright/whipplescript' && (github.event_name == 'schedule' || inputs.deep) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      # Installs elan and the toolchain `models/lean/lean-toolchain` pins, and
      # caches `.lake`. It is told to build nothing: `check-lean-models.sh` owns
      # the build because it also refuses sorry/admit/axiom/native_decide, and a
      # `lake build` beside it would report a green that skipped that refusal.
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          lake-package-directory: models/lean
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
      - name: Lean proof checks
        run: scripts/check-lean-models.sh

  # Mirror only — Nix plus TLC.
  tla-models:
    if: ${{ github.repository == 'GaugeWright/whipplescript' && (github.event_name == 'schedule' || inputs.deep) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
      - name: TLA model checks
        run: scripts/check-tla-models.sh

  # Mirror only — the end-to-end suite.
  e2e:
    if: ${{ github.repository == 'GaugeWright/whipplescript' && (github.event_name == 'schedule' || inputs.deep) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: E2E smoke
        run: scripts/check-e2e.sh

  # Mirror only — schema conformance.
  report-schemas:
    if: ${{ github.repository == 'GaugeWright/whipplescript' && (github.event_name == 'schedule' || inputs.deep) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install Maude
        run: |
          sudo apt-get update
          sudo apt-get install -y maude
      - name: Install Python tooling
        run: python3 -m pip install --user -r requirements-dev.txt
      - name: Report schema checks
        run: scripts/check-report-schemas.sh

  # `-src` only: it drives scripts and credentials the mirror does not carry.
  #
  # ON THE SCHEDULE AS WELL AS ON DISPATCH, which it was not. The condition read
  # `inputs.deep` alone, and `inputs` is null on a `schedule` event — so the
  # weekly cron could never fire this job and its ONLY trigger was a hand
  # dispatch, which AGENTS.md forbids an agent from performing. Everything
  # reachable only from `scripts/check-release-readiness.sh` therefore had no
  # effective trigger at all: the `.ir` golden check, the store-replay and
  # trace<->model conformance bridges, the artifact-admission differential, the
  # cancellation policy matrix, the control-plane driver, the docs site.
  # `scripts/README.md` already described this job as "on schedule or dispatch";
  # the condition is what did not say so.
  #
  # The comment this replaces justified dispatch-only as "far too long for
  # `-src`'s weekly cron to ever finish". That reasoning belongs to the era when
  # `-src` had exhausted its Actions allowance and jobs there were evicted; the
  # header of this file records that constraint as retired, and every other deep
  # job already runs on the cron. The 20-minute timeout below is the real budget,
  # and it is the same one the dispatch path has always had.
  #
  # Every sibling deep job spells the same pair the same way — see formal-models,
  # lean-models, tla-models, e2e, report-schemas above; only the repository half
  # differs, because those five run on the mirror and this one cannot.
  release-readiness:
    if: ${{ github.repository != 'GaugeWright/whipplescript' && (github.event_name == 'schedule' || inputs.deep) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install Python tooling
        run: python3 -m pip install --user -r requirements-dev.txt
      - name: Release readiness
        # The skip is a delegation, not a hole: `report-schemas` above runs
        # `scripts/check-report-schemas.sh` on the same weekly cron, on the
        # mirror, with the Maude and jsonschema tooling it needs and this job
        # does not install. Dropping the flag here would fail on missing tooling
        # rather than check anything more.
        run: WHIPPLESCRIPT_RELEASE_SKIP_REPORT_SCHEMAS=1 scripts/check-release-readiness.sh
      - name: Upload readiness reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: readiness-reports
          path: |
            target/release-readiness-report.md
            target/real-provider-smoke-report.md
