name: CI

on:
  workflow_dispatch:
    inputs:
      deep:
        description: Run formal, end-to-end, schema, and release-readiness checks
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE-APACHE'
      - 'LICENSE-MIT'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE-APACHE'
      - 'LICENSE-MIT'
  schedule:
    - cron: "37 6 * * 2"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Rust tests
        run: cargo test --workspace

  hosted-runtime-contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/whipplescript-host-do/worker
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install matching wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: crates/whipplescript-host-do/worker/package-lock.json
      - run: npm ci
      - name: Inventory production runtime routes and run authenticated compositions
        run: npm test
      - name: Typecheck Worker
        run: npx tsc --noEmit
      - name: Build production public Worker artifact
        run: npx wrangler deploy --config wrangler.public.toml --dry-run --outdir dist-ci

  formal-models:
    if: ${{ github.event_name == 'schedule' || inputs.deep }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Maude
        run: |
          sudo apt-get update
          sudo apt-get install -y maude
      - name: Install Python tooling
        run: python3 -m pip install --user -r requirements-dev.txt
      - name: Formal model checks
        run: WHIPPLESCRIPT_FORMAL_SKIP_TLA=1 scripts/check-formal-models.sh

  tla-models:
    if: ${{ github.event_name == 'schedule' || inputs.deep }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: TLA model checks
        run: scripts/check-tla-models.sh

  e2e:
    if: ${{ github.event_name == 'schedule' || inputs.deep }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: E2E smoke
        run: scripts/check-e2e.sh

  report-schemas:
    if: ${{ github.event_name == 'schedule' || inputs.deep }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Maude
        run: |
          sudo apt-get update
          sudo apt-get install -y maude
      - name: Install Python tooling
        run: python3 -m pip install --user -r requirements-dev.txt
      - name: Report schema checks
        run: scripts/check-report-schemas.sh

  release-readiness:
    if: ${{ github.event_name == 'schedule' || inputs.deep }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Python tooling
        run: python3 -m pip install --user -r requirements-dev.txt
      - name: Release readiness
        run: WHIPPLESCRIPT_RELEASE_SKIP_REPORT_SCHEMAS=1 scripts/check-release-readiness.sh
      - name: Upload readiness reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: readiness-reports
          path: |
            target/release-readiness-report.md
            target/real-provider-smoke-report.md
