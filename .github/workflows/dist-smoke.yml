name: Dist Smoke

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  # Read-only by default; a job that needs more declares it.
  contents: read

jobs:
  # Ubuntu 22.04 on both repositories, and pinned rather than latest. This is
  # the only job that executes the packaged GNU/Linux archive, so the glibc it
  # runs against is the compatibility floor the release is tested at. A newer
  # image would pass a binary that fails on 22.04 and call the release good.
  packaged-linux-x64:
    runs-on: ${{ github.repository == 'GaugeWright/whipplescript' && 'ubuntu-22.04' || 'blacksmith-4vcpu-ubuntu-2204' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Download local release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: artifacts-build-local-*
          path: target/distrib/
          merge-multiple: true
      - name: Smoke packaged Linux x64 binary
        run: scripts/check-dist-archive.sh target/distrib/whipplescript-x86_64-unknown-linux-gnu.tar.xz
