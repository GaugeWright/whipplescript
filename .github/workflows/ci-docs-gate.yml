name: CI (docs)

# WHY THIS EXISTS. `ci.yml` carries `paths-ignore` for `docs/**` and the
# top-level text files, so a pull request that touches only those never starts
# it. `green-bar` and `hosted-runtime-contracts` are required status checks on
# `main`, and a required check that never runs is not pending — it is missing,
# and the pull request reports BLOCKED forever. A docs-only change therefore
# could not merge at all; the deadlock stayed hidden only because every earlier
# docs change happened to touch `mkdocs.yml` or an asset outside the ignore
# list, which started `ci.yml` normally.
#
# This workflow runs exactly when `ci.yml` does not, and reports the two
# required contexts. Its jobs are deliberately empty: nothing under `docs/**`
# can change what `scripts/check.sh` or the Worker contracts verify, which is
# the same judgement the `paths-ignore` list already makes. Documentation
# content is checked by `check-docs-examples.sh`, `check-docs-snippets.sh`, and
# the strict mkdocs build, which run inside the green bar on any change that
# reaches it.
#
# THE COUPLING. `paths` below must stay the exact complement of the
# `paths-ignore` lists in `ci.yml`. If the two drift, a pull request either
# starts both workflows (two check runs of the same name) or neither (the
# deadlock returns, which is the failure that is silent). They are not
# derivable from each other in the workflow syntax, so
# `scripts/check-ci-docs-gate.sh` asserts the complement and runs in the green
# bar — an edit to `ci.yml` is itself outside the ignore list, so that check
# always runs on the change that could break it.

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE-APACHE'
      - 'LICENSE-MIT'

# A superseded run on a docs branch is as wasted as any other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job NAMES are the contract: a required status check is satisfied by a
  # check run of that name, whichever workflow produced it. Renaming either job
  # here, or its twin in `ci.yml`, breaks the gate.
  green-bar:
    runs-on: ubuntu-latest
    steps:
      - name: Documentation-only change
        run: echo "No code path changed; ci.yml is path-skipped for this pull request."

  hosted-runtime-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Documentation-only change
        run: echo "No Worker configuration changed; ci.yml is path-skipped for this pull request."
