name: Deploy docs to Cloudflare Pages

# Builds the mkdocs-material site and deploys it to the Cloudflare Pages
# project "whipplescript-docs" (custom domain: docs.whipplescript.com).
#
# One-time setup (see docs-site notes):
#   1. Cloudflare → Workers & Pages → create a Pages project named
#      "whipplescript-docs" (Direct Upload).
#   2. Add the repo secret CLOUDFLARE_API_TOKEN (Pages:Edit), and the repo
#      *variable* CLOUDFLARE_ACCOUNT_ID — a variable, not a secret, per DR-0067
#      (see the deploy step below).
#   3. Attach docs.whipplescript.com as a custom domain on that project.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ${{ github.repository == 'GaugeWright/whipplescript' && 'ubuntu-latest' || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install mkdocs-material
        run: pip install mkdocs-material

      - name: Build docs (strict)
        run: mkdocs build --strict

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # A Cloudflare account id is an identifier, not a credential, so it is a
          # variable under DR-0067. It was a secret until 2026-08-13, which hid a
          # stale value: the organisation moved accounts and the secret still held
          # the old one, so this lane would have kept failing after the API token
          # was provisioned, for a reason nobody could read.
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=whipplescript-docs
